# A local NATS server for trying KITTY against a real bus (`make nats`).
#
#   nats://localhost:4222  normal NATS clients (nats CLI, services, the publish script)
#   ws://localhost:8080    WebSocket, which is what browsers (and KITTY) connect to
#
# DEV ONLY: no TLS and no auth. For anything reachable from a network, see
# https://infrashift.github.io/kitty-event-bus-client/guides/live-nats/#production-checklist

port: 4222
http_port: 8222

websocket {
  port: 8080
  no_tls: true
}
